server:
  port: 8083

spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:postgresql://localhost:5433/heatshield_spatial
    username: heatshield
    password: heatshield_dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  kafka:
    bootstrap-servers: localhost:29092

openai:
  api-key: ${OPENAI_API_KEY:dummy-key}

routing:
  service:
    url: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.heatshield: DEBUG
    dev.langchain4j: DEBUG
    org.springframework.kafka: INFO

gemini:
  api-key: ${GEMINI_API_KEY:dummy-key}
