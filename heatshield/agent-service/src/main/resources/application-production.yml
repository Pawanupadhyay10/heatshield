spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:${REDIS_URL}}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

# Disable Kafka listener on startup if broker unavailable
spring.kafka.listener.missing-topics-fatal: false

openai:
  api-key: ${OPENAI_API_KEY:dummy}

gemini:
  api-key: ${GEMINI_API_KEY:dummy}

routing:
  service:
    url: ${ROUTING_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.heatshield: INFO
    org.springframework: WARN
    org.apache.kafka: ERROR
