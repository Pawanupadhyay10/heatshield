server:
  port: 8084

spring:
  application:
    name: routing-service

  datasource:
    url: jdbc:postgresql://localhost:5433/heatshield_spatial
    username: heatshield
    password: heatshield_dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      pool-name: routing-pool

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
    open-in-view: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.heatshield: DEBUG
    org.springframework.web: INFO
