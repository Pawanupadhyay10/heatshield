server:
  port: 8082

spring:
  application:
    name: heat-processing-service
  datasource:
    url: jdbc:postgresql://localhost:5434/heatshield_timeseries
    username: heatshield
    password: heatshield_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  kafka:
    bootstrap-servers: localhost:29092
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.heatshield: DEBUG
    org.springframework.kafka: INFO
