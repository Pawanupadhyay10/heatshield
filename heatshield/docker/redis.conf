# HeatShield Redis Configuration
# Tuned for caching + pub/sub use cases

# Persistence: RDB snapshot every 60s if 1000 keys changed
save 60 1000
save 300 100
save 3600 1

# Memory limit — prevent Redis eating all RAM on dev machine
maxmemory 512mb

# Eviction policy: remove least-recently-used keys when full
# LRU is correct for a cache (heat index values)
maxmemory-policy allkeys-lru

# Enable keyspace notifications for cache invalidation
# K = keyspace, E = keyevent, x = expired events
notify-keyspace-events KExx

# Disable protected mode for Docker networking
protected-mode no

# Log level
loglevel notice

# Slow log — log queries taking more than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128
