server:
  port: 8081

spring:
  application:
    name: weather-ingestion-service

  # Redis — cache OWM responses
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  # Kafka producer config
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all          # wait for all replicas before confirming
      retries: 3
      properties:
        spring.json.type.mapping: heatEvent:com.heatshield.ingestion.model.HeatEvent
        enable.idempotence: true  # exactly-once semantics

# OpenWeatherMap API
owm:
  base-url: https://api.openweathermap.org
  api-key: ${OWM_API_KEY:your_key_here}  # set via env var

# Polling interval (ms) — 15 minutes default
ingestion:
  poll-interval-ms: 900000

# Resilience4j — circuit breaker around OWM API
resilience4j:
  circuitbreaker:
    instances:
      owm-api:
        sliding-window-size: 10
        failure-rate-threshold: 50       # open after 50% failures
        wait-duration-in-open-state: 60s # try again after 60s
        permitted-calls-in-half-open-state: 3
  retry:
    instances:
      owm-api:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2

# Actuator — expose metrics for Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.heatshield: DEBUG
    org.springframework.kafka: INFO
