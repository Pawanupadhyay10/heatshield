server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5433/heatshield_spatial
    username: heatshield
    password: heatshield_dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
    open-in-view: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:29092

# Channel credentials — all optional
# Set in Codespaces secrets to enable real delivery
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:dummy}
  auth-token:  ${TWILIO_AUTH_TOKEN:dummy}
  from-number: ${TWILIO_FROM_NUMBER:+15005550006}

sendgrid:
  api-key:    ${SENDGRID_API_KEY:dummy}
  from-email: alerts@heatshield.app

fcm:
  server-key: ${FCM_SERVER_KEY:dummy}

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.heatshield: DEBUG
    org.springframework.kafka: INFO
